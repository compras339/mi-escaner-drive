<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<style>
html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:100%;height:100%}
.chef{--dur:1.4s;width:100%;height:100%;display:flex;align-items:center;justify-content:center}

a{color:#F5A524}a:hover{color:#FFC65C}

.chef svg{display:block;overflow:visible}
.arm{transform-box:view-box;transform-origin:172px 207px;animation:ae-toss var(--dur) ease-in-out infinite}
.food{transform-box:fill-box;transform-origin:50% 50%;animation:ae-flip var(--dur) ease-in-out infinite}
.food.f2{animation-delay:calc(var(--dur) * 0.06)}
.food.f3{animation-delay:calc(var(--dur) * 0.12)}
.food.f4{animation-delay:calc(var(--dur) * 0.03)}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:ae-flick .35s ease-in-out infinite alternate}
.flame.b{animation-duration:.27s}
.flame.c{animation-duration:.42s}
.steam{fill:none;stroke:#C9D3DE;stroke-width:3;stroke-linecap:round;opacity:0;animation:ae-steam 2.4s ease-out infinite}
.steam.s2{animation-delay:.8s}
.steam.s3{animation-delay:1.6s}
.head{transform-box:view-box;transform-origin:130px 160px;animation:ae-bob var(--dur) ease-in-out infinite}
.eye{transform-box:fill-box;transform-origin:50% 50%;animation:ae-blink 4s infinite}
.sleeve{fill:none;stroke:#F5F1EA;stroke-width:20;stroke-linecap:round;stroke-linejoin:round}
.handle{fill:none;stroke:#3A3F47;stroke-width:7;stroke-linecap:round}
.smile{fill:none;stroke:#5A2E1C;stroke-width:2.5;stroke-linecap:round}







@keyframes ae-toss{0%,100%{transform:rotate(0deg)}30%{transform:rotate(-13deg)}48%{transform:rotate(5deg)}62%{transform:rotate(0deg)}}
@keyframes ae-flip{0%,28%{transform:translate(0,0) rotate(0deg)}52%{transform:translate(-8px,-64px) rotate(200deg)}80%,100%{transform:translate(0,0) rotate(360deg)}}
@keyframes ae-flick{from{transform:scale(1,1)}to{transform:scale(1.1,.78)}}
@keyframes ae-steam{0%{opacity:0;transform:translateY(0)}25%{opacity:.55}100%{opacity:0;transform:translateY(-34px)}}
@keyframes ae-bob{0%,100%{transform:translateY(0) rotate(0deg)}30%{transform:translateY(-2px) rotate(-3deg)}}
@keyframes ae-blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}


@media (prefers-reduced-motion: reduce){.arm,.food,.flame,.steam,.head,.eye,.bar,.steam{opacity:.4}}

</style></head>
